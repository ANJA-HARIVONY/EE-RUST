[package]
name = "ee-salon"
version = "0.1.0"
description = "Gestion de salon de beauté"
edition = "2021"
rust-version = "1.85"

[lib]
name = "ee_salon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
chrono = "0.4"
dotenvy = "0.15"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.12.5", features = [] }
thiserror = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
